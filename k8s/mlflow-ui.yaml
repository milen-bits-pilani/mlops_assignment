apiVersion: v1
kind: Service
metadata:
  name: mlflow-ui-service
  labels:
    app: mlflow-ui
spec:
  type: NodePort
  ports:
  - port: 5000
    targetPort: 5000
    protocol: TCP
    name: mlflow
    nodePort: 30050
  selector:
    app: mlflow-ui
---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: mlflow-ui
  labels:
    app: mlflow-ui
spec:
  replicas: 1
  selector:
    matchLabels:
      app: mlflow-ui
  template:
    metadata:
      labels:
        app: mlflow-ui
    spec:
      containers:
      - name: mlflow-ui
        image: python:3.12-slim
        command: ["/bin/bash"]
        args:
          - -c
          - |
            pip install --upgrade pip setuptools wheel && \
            pip install mlflow==2.11.3 && \
            mlflow ui --host 0.0.0.0 --port 5000 --backend-store-uri file:///mlruns
        ports:
        - containerPort: 5000
        env:
        - name: MLFLOW_BACKEND_STORE_URI
          value: "file:///mlruns"
        - name: MLFLOW_DEFAULT_ARTIFACT_ROOT
          value: "file:///mlruns"
        readinessProbe:
          httpGet:
            path: /
            port: 5000
          initialDelaySeconds: 30
          periodSeconds: 10
          timeoutSeconds: 5
          failureThreshold: 3
        livenessProbe:
          httpGet:
            path: /
            port: 5000
          initialDelaySeconds: 60
          periodSeconds: 30
          timeoutSeconds: 5
          failureThreshold: 3
        volumeMounts:
        - name: mlruns
          mountPath: /mlruns
        resources:
          requests:
            memory: "256Mi"
            cpu: "250m"
          limits:
            memory: "512Mi"
            cpu: "500m"
      volumes:
      - name: mlruns
        hostPath:
          path: /tmp/mlruns
          type: DirectoryOrCreate


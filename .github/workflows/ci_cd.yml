name: CI/CD Pipeline

on: 
  push:
    branches:  [ main, develop ]
  pull_request:
    branches: [ main, develop ]

jobs: 
  lint:
    name: Code Linting
    runs-on: ubuntu-latest
    steps: 
      - uses: actions/checkout@v3
      
      - name: Set up Python
        uses: actions/setup-python@v4
        with: 
          python-version: '3.12'
      
      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install flake8 black pylint
      
      - name: Run Black (code formatting check)
        run: |
          black --check src/ tests/
      
      
      - name: Run Pylint
        run: |
          pylint src/ tests/ --max-line-length=120 || true

  test:
    name:  Unit Tests
    runs-on:  ubuntu-latest
    steps: 
      - uses: actions/checkout@v3
      
      - name: Set up Python
        uses:  actions/setup-python@v4
        with:
          python-version: '3.12'
      
      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt
      
      - name: Run tests with pytest
        run: |
          pytest tests/ -v --cov=src --cov-report=xml --cov-report=html
      
      - name: Upload coverage reports
        uses:  codecov/codecov-action@v3
        with:
          files: ./coverage.xml
          fail_ci_if_error:  false

  train:
    name: Model Training
    runs-on: ubuntu-latest
    needs:  [lint, test]
    steps:
      - uses: actions/checkout@v3
      
      - name: Set up Python
        uses: actions/setup-python@v4
        with:
          python-version: '3.12'
      
      - name:  Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt
      
      - name: Download dataset
        run: |
          python src/data/download_data.py
      
      - name: Run EDA
        run: |
          python -c "from src.eda.explore import perform_eda; perform_eda('data/raw/heart_disease.csv')"
      
      - name: Train models
        env:
          # Set HOME to workspace to avoid path resolution issues with MLflow
          HOME: ${{ github.workspace }}
          # Set MLflow tracking URI to workspace/mlruns (absolute path)
          MLFLOW_TRACKING_URI: file://${{ github.workspace }}/mlruns
          # Mark as CI environment
          CI:  "true"
        run: |
          # Remove existing mlruns if present (to avoid hardcoded paths in meta.yaml)
          rm -rf mlruns
          # Create fresh mlruns directory
          mkdir -p mlruns
          python src/models/train. py data/raw/heart_disease.csv
      
      - name: Upload model artifacts
        uses:  actions/upload-artifact@v4
        with:
          name:  models
          path: |
            models/
            data/eda/
          retention-days: 7
      
      - name:  Upload MLflow artifacts
        uses:  actions/upload-artifact@v4
        with:
          name:  mlflow-runs
          path:  mlruns/
          retention-days: 7
          if-no-files-found: ignore

  build:
    name: Build Docker Image
    runs-on:  ubuntu-latest
    needs: [train]
    permissions:
      contents: read
      packages: write
    steps: 
      - uses: actions/checkout@v3
      
      - name: Download model artifacts
        uses:  actions/download-artifact@v4
        with:
          name:  models
          path: ./
      
      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v2
      
      - name: Log in to GitHub Container Registry
        uses: docker/login-action@v2
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets. GITHUB_TOKEN }}
      
      - name: Extract metadata for Docker
        id: meta
        uses: docker/metadata-action@v4
        with:
          images: ghcr.io/${{ github.repository }}
          tags: |
            type=ref,event=branch
            type=ref,event=pr
            type=sha,prefix={{branch}}-
            type=raw,value=latest,enable={{is_default_branch}}
      
      - name: Build Docker image
        uses: docker/build-push-action@v4
        with:
          context: . 
          push: false
          load: true
          tags: heart-disease-api:latest
          cache-from: type=gha
          cache-to: type=gha,mode=max
      
      - name: Test Docker image
        run: |
          docker run -d -p 8000:8000 --name test-api heart-disease-api:latest
          sleep 10
          curl -f http://localhost:8000/health || exit 1
          docker stop test-api
          docker rm test-api
      
      - name: Build and push Docker image
        uses: docker/build-push-action@v4
        with:
          context: .
          push: true
          tags: ${{ steps.meta.outputs.tags }}
          labels: ${{ steps.meta.outputs.labels }}
          cache-from: type=gha
          cache-to: type=gha,mode=max
